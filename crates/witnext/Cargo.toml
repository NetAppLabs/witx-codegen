[package]
name = "witx"
version = "0.10.0-beta4"
description = "witx parser for the witx-codegen webassembly code generator"
homepage = "https://github.com/WebAssembly/WASI"
repository = "https://github.com/WebAssembly/WASI"
license = "Apache-2.0"
categories = ["wasm"]
keywords = ["webassembly", "wasm"]
authors = ["Pat Hickey <phickey@fastly.com>", "Alex Crichton <alex@alexcrichton.com>"]
edition = "2018"

[lib]
crate-type=["rlib"]

[dependencies]
anyhow = "1"
log = "0.4"
thiserror = "1.0"
wast = { version = "46.0.0", default-features = false }

[dev-dependencies]
rayon = "1.5.1"

[[test]]
name = "witxt"
harness = false
